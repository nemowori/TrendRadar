name: Check In

# 用户选择的自动签到：北京时间每天 07:00（UTC 前一天 23:00）。
# 以本工作流最近一次成功运行为续期凭据，保留全部运行日志。
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trendradar-check-in
  cancel-in-progress: false

jobs:
  check_in:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Renew and enable news workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow enable crawler.yml
          echo "签到成功，已确认新闻工作流启用。" >> "$GITHUB_STEP_SUMMARY"
          TZ=Asia/Shanghai date '+北京时间 %Y-%m-%d %H:%M:%S' >> "$GITHUB_STEP_SUMMARY"
          echo "保留运行历史；七天有效期从本次成功签到计算。" >> "$GITHUB_STEP_SUMMARY"
