name: Get Hot News

on:
  push:
    branches: [master]
    paths: [".github/deployment-test.txt"]
  schedule:
    # 每小时采集一次，避开整点高峰；时间线按 Asia/Shanghai 决定晚间推送。
    - cron: "17 * * * *"
    # 北京时间08:00、11:00、17:00，分别对应UTC 00:00、03:00、09:00。
    - cron: "0 0,3,9 * * *"
  workflow_dispatch:
    inputs:
      send_now:
        description: "立即发送当前财经新闻，验证钉钉推送"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check renewal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LAST_CHECK_IN=$(gh api "repos/$GH_REPO/actions/workflows/clean-crawler.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty')
          if [ -z "$LAST_CHECK_IN" ]; then
            LAST_CHECK_IN=$(gh api "repos/$GH_REPO" --jq '.created_at')
          fi
          AGE=$(( $(date +%s) - $(date -d "$LAST_CHECK_IN" +%s) ))
          if [ "$AGE" -gt 604800 ]; then
            echo "::error::超过七天未成功签到，请运行 Check In。"
            gh workflow disable crawler.yml
            exit 1
          fi
          echo "最近续期依据：$LAST_CHECK_IN" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore collected news and push state
        id: news-cache
        uses: actions/cache/restore@v4
        with:
          path: output
          key: news-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-state-v1-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Configure manual preview
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.send_now)
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path("config/config.yaml")
          config = yaml.safe_load(path.read_text(encoding="utf-8"))
          config["schedule"]["enabled"] = False
          config["report"]["mode"] = "current"
          path.write_text(yaml.safe_dump(config, allow_unicode=True, sort_keys=False), encoding="utf-8")
          PY

      - name: Test DingTalk delivery
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.send_now)
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        run: |
          test -n "$DINGTALK_WEBHOOK_URL" || { echo "::error::请先配置 DINGTALK_WEBHOOK_URL"; exit 1; }
          uv run python -m trendradar --test-notification

      - name: Run crawler
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          AI_ANALYSIS_ENABLED: "true"
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          test -n "$DINGTALK_WEBHOOK_URL" || { echo "::error::缺少钉钉推送密钥"; exit 1; }
          test -n "$AI_API_KEY" || { echo "::error::缺少 AI_API_KEY"; exit 1; }
          uv run python -m trendradar

      - name: Save collected news and push state
        uses: actions/cache/save@v4
        with:
          path: output
          key: ${{ steps.news-cache.outputs.cache-primary-key }}

      - name: Save readable news report
        uses: actions/upload-artifact@v4
        with:
          name: finance-news-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            index.html
            output/**/*.html
          if-no-files-found: warn
          retention-days: 7

      - name: Explain report coverage
        run: |
          echo "覆盖财经、国际局势、战争地缘、能源期货、气候灾害与产业；DeepSeek生成中文市场影响分析。" >> "$GITHUB_STEP_SUMMARY"
          echo "北京时间08:00、11:00、17:00各推送一次截至当时的当日汇总；平台可能延迟。" >> "$GITHUB_STEP_SUMMARY"
          echo "采集状态使用 GitHub Cache 跨次恢复；缓存可能被回收，不作为永久备份。" >> "$GITHUB_STEP_SUMMARY"
