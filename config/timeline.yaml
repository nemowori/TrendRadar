# 北京时间每天08:00、11:00、17:00各推送一次当日财经新闻汇总。
# 两小时窗口允许 GitHub 调度延迟；同一窗口只推送一次。
custom:
  name: "A股每日三次汇总"
  description: "每天早间、午间、收盘后集中阅读财经新闻"
  default:
    collect: true
    analyze: false
    ai_mode: "daily"
    push: false
    report_mode: "daily"
    once:
      analyze: true
      push: true
  periods:
    morning:
      name: "A股早间新闻"
      start: "08:00"
      end: "10:00"
      analyze: true
      push: true
      report_mode: "daily"
    midday:
      name: "A股午间新闻"
      start: "11:00"
      end: "13:00"
      analyze: true
      push: true
      report_mode: "daily"
    after_market:
      name: "A股收盘后新闻"
      start: "17:00"
      end: "19:00"
      analyze: true
      push: true
      report_mode: "daily"
  day_plans:
    everyday:
      periods: ["morning", "midday", "after_market"]
  week_map:
    1: "everyday"
    2: "everyday"
    3: "everyday"
    4: "everyday"
    5: "everyday"
    6: "everyday"
    7: "everyday"
  overlap:
    policy: "error_on_overlap"
